# Publishes mystmd-lsp to npm at the version in package.json, then tags the commit mystmd-lsp-v<version> and creates a GitHub release.
# Run it from the Actions tab (Release → Run workflow), or: gh workflow run release.yml
# See docs/contributing.md.
name: Release
on: workflow_dispatch
jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm 11.5.1 or newer
      - run: npm ci
      - run: npm test
      - id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - run: npm publish
  github-release:
    needs: [npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: mystmd-lsp-v${{ needs.npm.outputs.version }}
