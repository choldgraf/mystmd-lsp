name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
  # Moves the `latest` tag to this commit and replaces the server tarball on the `latest` pre-release.
  latest:
    if: github.event_name == 'push'
    needs: [js]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: latest-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm pack && mv mystmd-lsp-*.tgz mystmd-lsp.tgz
      - run: git push -f origin HEAD:refs/tags/latest
      - run: |
          gh release create latest --prerelease --title latest --notes "$NOTES" || gh release edit latest --notes "$NOTES"
          gh release upload latest mystmd-lsp.tgz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: Built from ${{ github.sha }}, the latest commit on main that passed CI.
